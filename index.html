<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <title> cst3144-example </title>
</head>
<body>
  <!-- this gives a direct link to the source code for the vue framework-->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <div id="app">

    <button @click="showCheckout">
      <i class="fa fa-shopping-cart" aria-hidden="true"></i>
      Checkout ({{cartItemCount}})  
    </button>

    <main>
      <div v-if="showProduct">

        <h1 v-text="sitename"> </h1>

        <figure>
          <img v-bind:src="product.image" width = 300>
        </figure>

        <h2 v-text="product.title"> </h2>

        <p v-text="product.description"> </p>

        <p> Price: ${{product.price}} </p>

        <p> {{product.availableInventory}} available. </p>

        <button v-on:click="addItem()" v-show="canAddToCart">
          Add to cart 
        </button>

      </div>

      <div v-else>

        <h1> Checkout Page </h1>

        <p> Items in cart: {{cartItemCount}} </p>

      </div>

    </main>
  </div>

  <script type="module">
    const {createApp} = Vue
    const petstore = createApp({
      data() {
        return{
          sitename: "Vue.js Pet Depot",
          showProduct: true,
          product: {
            id: 1001,
            title: "Cat Food, 25lb bag",
            description: "A 25 pound bag of irresistible, " + "organic goodness for your cat.",
              price: 2000,
              image: "Images/catFood.jpg",
              availableInventory: 5
          },
          cart:[]
        }
      },

      computed:{
        cartItemCount(){
          return this.cart.length;
        },

        canAddToCart(){
          return this.product.availableInventory > this.cartItemCount;
        }
      },
      
      methods:{
        addItem(){
          this.cart.push(this.product.id);
        },

        showCheckout(){
          this.showProduct = this.showProduct ? false : true;
        }
      }
    })
    petstore.mount('#app')
  </script>
</body>
</html>
