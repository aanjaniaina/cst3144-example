<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <title> cst3144-example </title>
</head>
<body>

  <!-- this gives a direct link to the source code for the vue framework--> 
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!--  +  +  -->
  <script type="module">

    const {createApp} = Vue 
    const myApp = createApp ({
      //data stores the information used by the webpages
      data() {
        return{
          sitename: "Subject",
          subjectDetails: {
            subject: "Computer Science",
            id: "1001", //give the lesson an ID number
            location: "Hendon",
            price: "$10",
            image: "/cst3144-example/Images/computer_science.jpg",
            alt: "Computer Science",
            availability: 4, //add an availability field that tracks how many slots are available
          },
          cart:[], // stores the ID of lessons added to the cart
          displayCart: false // a boolean variable that controls wheter the cart is displayed 
        }
      },
      
      
      computed: {
        canAddToCart() {
          return this.subjectDetails.availability > 0; //check whether at least one lesson slot is available
        },

        numberOfItems() {
          return this.cart.length; // returns the number of items currently in the cart
        }
      },

      methods: {
        addToCart() {
          this.cart.push(this.subjectDetails.id); //add the lesson's ID to the cart
          this.subjectDetails.availability --; //reduces the available the lesson slots by 1
        },

        showCheckout() {
          this.displayCart = this.displayCart ? false : true ; // toggles between displaying the lessons information and chekout placeholder
        }
      }
    })
    myApp.mount('#div1')
  </script>

<div id="div1">
  <!--enable only when there is at least one item in the cart and checkout btn to display the nbr of items in the cart-->

  <button 
  @click = "showCheckout" 
  v-bind:disabled = "numberOfItems == 0" >
    Checkout {{numberOfItems}}
  </button> 

  <main>
    <div v-if = "!displayCart"> 
      <!--the lessons info is displayed when displayCart is false-->

      <h1> After School Club </h1>
      <img v-bind:src="subjectDetails.image" v-bind:alt="subjectDetails.alt" width="250">
      <h3> Subject </h3>
      <p> {{subjectDetails.subject}} </p>
      <p> ID: {{subjectDetails.id}} </p>
      <p> {{subjectDetails.location}} </p>
      <p> {{subjectDetails.price}} </p>
      <p> {{subjectDetails.availability}} slots availables </p>

      <button v-on:click = "addToCart" v-bind:disabled = "!canAddToCart"> <!-- bind the method canAddToCart to the button add to cart -->
        Add to cart
      </button>
  </div>

  <div v-else>
    <!--display a cheeckout placeholder when displayCart is true-->
    <p> Check out </p>
  </div>
  </main>
</div>
</body>
</html>
