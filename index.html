<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <title> cst3144-example </title>
</head>
<body>
  <!-- this gives a direct link to the source code for the vue framework-->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

  <script type="module">
    const {createApp} = Vue 
    const myApp = createApp ({
      data() {
        return{
          sitename: "Subject",
          subjectDetails: {
            subject: "Computer Science",
            id: "1001",
            location: "Hendon",
            price: "$10",
            image: "/cst3144-example/Images/computer_science.jpg",
            alt: "Computer Science",
            availability: 4
          },
          cart:[]
        }
      },

      computed: {
        canAddToCart() {
          return this.subjectDetails.availability > 0
        }
      },

      methods: {
        addToCart() {
          this.cart.push(this.subjectDetails.id);
          this.subjectDetails.availability --
        }
      }
    })
    myApp.mount('#div1')
  </script>

  <div id="div1">
    <h1> After School Club </h1>

    <img v-bind:src="subjectDetails.image" v-bind:alt="alt" width="250">

    <h3> Subject </h3>

    <p> {{subjectDetails.subject}} </p>
    <p> ID: {{subjectDetails.id}} </p>
    <p> {{subjectDetails.location}} </p>
    <p> {{subjectDetails.price}} </p>
    <p> {{subjectDetails.availability}} slots availables </p>

    <button v-on:click = "addToCart" v-show = "addToCart">
      Add to cart
    </button>
  </div>
</body>
</html>
